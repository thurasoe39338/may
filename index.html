<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11101b">
  <meta name="description" content="စိတ်ဝင်စားစရာ အကြောင်းအရာများကို ဝင်ရောက်ကြည့်ရှုရန်။">
  <title>Exclusive Content | ဝင်ကြည့်ရန်</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <section class="card" aria-labelledby="page-title">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>EXCLUSIVE CONTENT</span>
      </div>

      <div class="image-wrap">
        <!-- ယာယီပုံဖြစ်ပါတယ်။ ကိုယ်ပိုင်ပုံပြောင်းချင်ရင် images/cover.svg ကို အစားထိုးပါ။ -->
        <img class="cover-image" src="images/cover.svg" alt="ယာယီ Cover ပုံ">
        <span class="image-label">FEATURED</span>
      </div>

      <div class="content">
        <p class="eyebrow">WELCOME</p>
        <h1 id="page-title">စိတ်ဝင်စားစရာများကို<br><span>ဝင်ရောက်ကြည့်ရှုပါ</span></h1>
        <p class="description">
          အောက်က ခလုတ်ကိုနှိပ်ပြီး အကြောင်းအရာအပြည့်အစုံကို ဆက်လက်ကြည့်ရှုနိုင်ပါတယ်။
        </p>

        <a class="cta" href="https://mghangyi.com" target="_blank" rel="noopener noreferrer">
          <span>ယခုပဲ ဝင်ကြည့်ရန်</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <p class="hint">တစ်ချက်နှိပ်ရုံဖြင့် ဆက်လက်ကြည့်ရှုနိုင်ပါသည်</p>
      </div>

      <footer>
        <span>© <span id="year">2026</span> Exclusive Content</span>
        <span class="footer-dot"></span>
        <span>All rights reserved</span>
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
